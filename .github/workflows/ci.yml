name: CI

on:
  push:
    branches: [main, GPU, GPU-feat, refactored-code]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (blocking - pyflakes rules and syntax errors, see pyproject.toml)
        run: ruff check src tests tools --output-format=github
      - name: Tests
        # Informational until a few runs on this runner confirm the baseline. The
        # earlier "known failures" were test pollution (module-level sys.modules
        # fakes) and stale assertions, both fixed; what remains is skips for the
        # Windows-only stack, reported by tests/conftest.py.
        continue-on-error: true
        run: pytest tests -q -rf

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: mypy (informational until a baseline is cleaned up)
        continue-on-error: true
        run: mypy src/core src/version.py
