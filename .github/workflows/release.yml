name: Auto Tag and Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
      - GPU
      - GPU-feat

  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to release"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - GPU
          - GPU-feat

permissions:
  contents: write

jobs:
  tag-and-release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Set target branch
        id: branch
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            branch="${{ inputs.target_branch }}"
          else
            branch="${{ github.event.pull_request.base.ref }}"
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          if [[ "$branch" == "GPU" ]]; then
            echo "prefix=gpu" >> "$GITHUB_OUTPUT"
            echo "release_name_prefix=Release GPU" >> "$GITHUB_OUTPUT"
          elif [[ "$branch" == "main" ]]; then
            echo "prefix=main" >> "$GITHUB_OUTPUT"
            echo "release_name_prefix=Release Main" >> "$GITHUB_OUTPUT"
          elif [[ "$branch" == "GPU-feat" ]]; then
            echo "prefix=gpu-feat" >> "$GITHUB_OUTPUT"
            echo "release_name_prefix=Release GPU feat" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 0

      - name: Create tag from src/version.py
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          prefix="${{ steps.branch.outputs.prefix }}"

          # src/version.py is the single source of truth for the version.
          version=$(sed -nE 's/^__version__[[:space:]]*=[[:space:]]*"([0-9]+(\.[0-9]+)*)".*/\1/p' src/version.py | head -n 1)
          if [[ -z "${version}" ]]; then
            echo "::error::Could not read __version__ from src/version.py"
            exit 1
          fi
          next_tag="${prefix}-${version}"

          git fetch --tags
          if git rev-parse -q --verify "refs/tags/${next_tag}" >/dev/null; then
            echo "::notice::Tag ${next_tag} already exists; skipping release. Bump __version__ in src/version.py to publish a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "next_tag=${next_tag}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${next_tag}"
          git push origin "${next_tag}"

      - name: Create source zip
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        run: |
          zip_name="source-${{ steps.tag.outputs.next_tag }}.zip"
          git archive --format=zip --output "$zip_name" HEAD
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.next_tag }}
          name: ${{ steps.branch.outputs.release_name_prefix }} ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
